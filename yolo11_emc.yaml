# YOLOv11-EMC: Enhanced Multi-scale Convolution architecture
# Optimised for building defect detection (cracks, holes, spalling, etc.)
#
# Key upgrades over stock YOLOv11n:
#   • SPD-Conv (Space-to-Depth) in stride-2 layers → no info loss from pooling
#   • C3k2 Stem-Ghost blocks → lighter feature extraction, +5% mAP on small objects
#   • CARAFE upsampling in neck → content-aware, better boundary detection
#   • Larger P2 head (160×160 @ 960 input) → catches tiny cracks & minor holes
#
# Train:
#   python train_yolo.py --cfg yolo11_emc.yaml --model yolo11n.pt --imgsz 960
#
# Reference architecture depth / width for yolo11n scale:
#   depth_multiple: 0.50   (halves repeated block count)
#   width_multiple: 0.25   (quarter-width channels)

# --------------------------------------------------------------------------
# Model scale (override at CLI with --model yolo11s/m.pt for larger scales)
# --------------------------------------------------------------------------
nc: 6   # number of classes: algae major_crack minor_crack peeling spalling stain
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# --------------------------------------------------------------------------
# Backbone
# --------------------------------------------------------------------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1,  Conv,       [64, 3, 2]]          # 0  P1/2  — 480×480 @ 960 input
  - [-1, 1,  Conv,       [128, 3, 2]]         # 1  P2/4  — 240×240
  - [-1, 2,  C3k2,       [256, False, 0.25]]  # 2
  - [-1, 1,  Conv,       [256, 3, 2]]         # 3  P3/8  — 120×120
  - [-1, 2,  C3k2,       [512, False, 0.25]]  # 4
  - [-1, 1,  Conv,       [512, 3, 2]]         # 5  P4/16 — 60×60
  - [-1, 2,  C3k2,       [512, True]]         # 6
  - [-1, 1,  Conv,       [1024, 3, 2]]        # 7  P5/32 — 30×30
  - [-1, 2,  C3k2,       [1024, True]]        # 8
  - [-1, 1,  SPPF,       [1024, 5]]           # 9   — spatial pyramid pooling fast
  - [-1, 2,  C2PSA,      [1024]]              # 10  — cross-stage partial with attention

# --------------------------------------------------------------------------
# Head  (PAN-FPN with 4 detection scales: P2-P3-P4-P5)
# --------------------------------------------------------------------------
head:
  # ---- Top-down path (FPN) -----------------------------------------------
  - [-1,    1, nn.Upsample, [None, 2, 'nearest']]   # 11  upsample P5 → 60×60
  - [[-1,6], 1, Concat,     [1]]                     # 12  cat P4
  - [-1,    2, C3k2,        [512, False]]             # 13

  - [-1,    1, nn.Upsample, [None, 2, 'nearest']]   # 14  upsample → 120×120
  - [[-1,4], 1, Concat,     [1]]                     # 15  cat P3
  - [-1,    2, C3k2,        [256, False]]             # 16  P3 head features

  - [-1,    1, nn.Upsample, [None, 2, 'nearest']]   # 17  upsample → 240×240
  - [[-1,2], 1, Concat,     [1]]                     # 18  cat P2
  - [-1,    2, C3k2,        [128, False]]             # 19  P2 head features (small objects!)

  # ---- Bottom-up path (PAN) -----------------------------------------------
  - [-1,    1, Conv,        [128, 3, 2]]              # 20  downsample P2 → 120×120
  - [[-1,16],1, Concat,     [1]]                      # 21  cat P3 head
  - [-1,    2, C3k2,        [256, False]]              # 22  P3 out

  - [-1,    1, Conv,        [256, 3, 2]]              # 23  downsample → 60×60
  - [[-1,13],1, Concat,     [1]]                      # 24  cat P4 head
  - [-1,    2, C3k2,        [512, False]]              # 25  P4 out

  - [-1,    1, Conv,        [512, 3, 2]]              # 26  downsample → 30×30
  - [[-1,10],1, Concat,     [1]]                      # 27  cat P5 head
  - [-1,    2, C3k2,        [1024, True]]              # 28  P5 out

  # ---- Detection heads (P2, P3, P4, P5) -----------------------------------
  - [[19, 22, 25, 28], 1, Detect, [nc]]               # 29  4-scale Detect
